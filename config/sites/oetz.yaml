# Draft copy of the site template — not a finished Ötztal map.
# Finished profiles: config/sites/*.yaml (see config/sites/README.md)
# Active site: copy onto config/site.yaml OR $env:AUTOROAD_SITE="config/sites/…"

name: tirol-test-ausschnitt
# Working CRS for bbox and processing (match the DGM tile):
#   EPSG:31254 = MGI / Austria GK West
#   EPSG:31255 = MGI / Austria GK Central
crs: EPSG:31254
authorities: tirol

# xmin, ymin, xmax, ymax in the CRS above (metres)
# Placeholder — replace with a real pass crop
bbox:
  - 0.0
  - 0.0
  - 1000.0
  - 1000.0

# Optional: approximate road centre as a hint (same CRS)
# centerline_hint_gpx: data/annotations/centerline.gpx

sources:
  dgm:
    type: wcs
    # Concrete URL from the tiris catalogue / QGIS layer source
    url: "https://REPLACE/ogd/wcs/gelaende"
    coverage: "DGM_50cm"          # from GetCapabilities
    resolution_m: 0.5
    # Or local:
    # type: local
    # path: data/raw/dgm.tif

  # DOM = DSM (Tyrol: Oberflaechenmodell_*). Vegetation height: build_twi.py → ndsm.tif
  dom:
    type: wcs
    url: "https://REPLACE/ogd/wcs/gelaende"
    coverage: "Oberflaechenmodell_50cm_M28"
    resolution_m: 0.5
    optional: true

  ortho:
    type: wcs
    url: "https://REPLACE/ogd/wcs/orthofoto"
    coverage: "Orthofoto_RGB"
    # First try often 1.0–2.0 m; 0.2 m only if needed
    resolution_m: 1.0

  landuse:
    type: osm                    # natural/landuse via Overpass
    # type: bev                  # BEV INSPIRE Land Cover WMS (see sources.bev_landcover)
    # type: featureserver        # Tyrol land use / forest FeatureServer
    # type: wfs
    # url: "https://REPLACE/ogd/wfs"
    # type_name: "Landnutzung"

  # Optional AT-wide classified land cover (feeds landuse:bev + biome masks)
  # bev_landcover:
  #   type: wms
  #   url: "https://data.bev.gv.at/geonetwork/srv/eng/catalog.search#/metadata/..."
  #   layers: "LC.LandCoverRaster"

  roads:
    type: osm
    # uses site.bbox (transformed to WGS84) for Overpass

  # Tyrol provincial-road WFS (structures). Cache; reload only with --force.
  gip:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Verkehrswege/WFSServer"
    type_name: "Verkehrswege:Verkehrswege"
    str_code: L13                # required for an efficient download

beamng:
  meters_per_pixel: 1.0          # heightmap resolution in the level (starting value)
  # max_height is derived from the DGM
  level_name: autoroad_test
  mask_size: 512
  slope_rock_deg: 38             # slope → rock layer
  road_width_scale: 1.0          # node width → asphalt mask / decal scale
  # Carriageway width = lanes × lane_width_m (default 2 × 3.75 = 7.5 m).
  lane_width_m: 3.75
  default_lanes: 2
  shoulder_m: 0.2                # dirt shoulder per side (m)
  # Optional: BEV×nDSM×TWI×snow → exclusive biomes + soft terrain (compose_biomes.py)
  # compose:
  #   ndsm_canopy_m: 5.0
  #   ndsm_scrub_m: 1.5
  #   ndsm_clearing_m: 1.0
  #   twi_wet: 5.0
  #   snow_light: 0.25
  #   snow_heavy: 0.55
  guardrails:
    enabled: true
    # posts (default) = delineators every spacing_m; sections = Italy rail mesh
    style: posts
    spacing_m: 25.0
    shape: reflector
    post_scale: 0.7              # native ~1.43 m → ≈1.0 m
    # style: sections + italy mesh for continuous rails:
    # shape: "/art/shapes/objects/italy_guardrails_common_section.dae"
    mesh_length_m: 3.1
    section_length_m: 4.2        # AT look via joint spacing / scale.x (sections only)
    curve_r15_m: 15.0
    curve_r10_m: 10.0
    curve_step_r15_m: 2.8
    curve_step_r10_m: 2.2
    abut_overlap_m: 0.08         # close seams between segments
    curvature_window_m: 8.0
    lateral_extra_m: 0.55
    z_sample_inward_m: 0.35
    sides: both                 # both | left | right | none | steep
    # centerline: gip            # gip = Verkehrswege OBJECTIDs | osm (default)
    # steep_sides:                # only if sides: steep / auto
    #   sample_m: 80
    #   look_out_m: 6.0
    #   drop_m: 2.5
    #   min_hits: 1
    highways: [secondary, primary, tertiary, trunk, motorway]
    z_lift_m: 0.05
    pivot_ground_offset_m: 0.0
    align_pitch: true
    snap_to_heightmap: true
    face_y_outward: true
    yaw_flip_right: false
    # Optional overrides (cascade: later matching rules win):
    # rules:
    #   - match: { lanes: ">2" }          # property group
    #     sides: both
    #   - match: { highway: [motorway, trunk] }
    #     sides: both
    #     lateral_extra_m: 0.4
    #   - match: { ids: [2301-2312, 2315, 2320-2324] }
    #     sides: left
    #   - match: { ids: 2400-2450 }
    #     sides: none                     # or present: false

# Hand-edited edges / guardrails (see docs/ANNOTATIONS.md).
# Schema: python tools/init_annotations_gpkg.py
# Heuristic draft: python tools/seed_annotations.py [--force]
# Build reads guardrail (auto), never writes the GPKG.
annotations:
  gpkg: data/annotations/tirol-test-ausschnitt.gpkg
  guardrail_source: auto   # auto | gpkg | heuristic

notes: |
  WCS links + bbox + coverage names are enough.
  Do not drop large GeoTIFFs into chat.
