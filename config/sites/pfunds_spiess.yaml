# Pfunds–Spiess — Grenzausschnitt Tirol / Graubünden.
# Aktivieren:  $env:AUTOROAD_SITE="config/sites/pfunds_spiess.yaml"
# Mittelpunkt 612243 / 5199204 (EPSG:25832). 8191×8191 m auf 8192², 1 m pro Sample.
# Gemeinde Spiss. Arbeits-CRS fest UTM32N, nicht das Tirol-GK der Behörde.
# Gelände und Straßen zuerst nur aus Tirol. schweiz steht in der Liste, weil
# der Kasten zu 41 % in der Schweiz liegt und der Straßenbau sonst abbricht.
# Ohne roads-Datei unter dieser Behörde wird dort noch nichts geladen.
# Katalog: schweiz, LV95, ID-Band +20_000_000.
name: pfunds-spiess-8192
crs: EPSG:25832
level:
  crs: EPSG:25832
authorities:
  - tirol
  - schweiz
bbox:
  - 608147.5
  - 5195108.5
  - 616338.5
  - 5203299.5

sources:
  dgm:
    # TODO: sources.dgm takes mixed coverages directly (WCS and STAC) and
    # builds the raster. A path to a file blended outside the fetch is the
    # stand-in until then.
    path: data/raw/dgm_pfunds-spiess-8192_mixed.tif
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Gelaendemodell_50cm_M28"
  dom:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Oberflaechenmodell_50cm_M28"
    version: "1.0.0"
    resolution_m: 0.5
    optional: true
    accept_all_nodata: true
    allow_incomplete: true
  twi:
    smooth_m: 10.0
  bev_landcover:
    type: wms
    url: "https://data.bev.gv.at/geoserver/INSdataLC/ows"
    layer: LC.LandCoverRaster
  snow:
    type: dgm_proxy
    preset: november
  ortho:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/orthofoto/MapServer/WCSServer"
    coverage: "Aktuell_RGB"
    resolution_m: 1.0
  backdrop_ortho:
    type: wms
    url: "https://wms.geo.admin.ch/"
    layer: ch.swisstopo.swissimage
    version: "1.3.0"
  roads:
    type: gip
  gip:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Verkehrswege/WFSServer"
    type_name: "Verkehrswege:Verkehrswege"
    str_code: B180
    include: bbox
    routing_idf: data/raw/gip_routingexport/routingexport_ogd.txt
  strassennetz:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Strassennetz/WFSServer"
    type_name: "Strassennetz:Strassennetz"
    str_code: B180
  av_landcover:
    # Graubünden cadastral land cover. Fills cells the BEV raster leaves empty.
    # Fels paints rock. Geröll is stored as mask_biome_geroell for later blocks.
    type: gpkg
    path: data/raw/gr_av_bodenbedeckung_pfunds-spiess-8192.gpkg
    layer: Bodenbedeckung_ohne_Gebaeude_farbig
    crs: EPSG:2056
    attribute: art
  landuse:
    type: bev
    layers:
      landnutzung:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Landnutzung/FeatureServer/0"
        label: Landnutzung
      waldflaeche:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Waldflaeche/FeatureServer/0"
        label: Waldfläche
  tiris_buildings:
    type: featureserver
    url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Gebaeude/FeatureServer/0"
  waterways:
    type: featureserver
    url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Fliessgewaesser/FeatureServer/0/query"

beamng:
  meters_per_pixel: 1.0
  level_name: pfunds_spiess
  mask_size: 8192
  slope_rock_deg: 40
  slope_rock_open_px: 1
  road_width_scale: 0.9
  lane_width_m: 3.75
  default_lanes: 2
  road_terrain: asphalt
  dirt_material: gravel
  dry_grass_material: dry_meadow
  forest_material: ForestFloor
  grass_material: Grass
  snow_material: SnowTirol
  snow_albedo_gain: 0.75
  shoulder_m: 3.0

  compose:
    ndsm_canopy_m: 5.0
    ndsm_scrub_m: 1.5
    ndsm_clearing_m: 1.0
    twi_wet: 5.0
    snow_light: 0.25
    snow_heavy: 0.55

  decal_roads:
    enabled: true
    centerline_source: gip
    gip_decals: named
    width_scale: 0.9
    material: AsphaltRoad_variation_01
    texture_length: 6.0
    detail_scale: 4.0
    render_priority: 10
    drivability: 1.0
    improved_spline: true
    densify_max_step_m: 10.0
    decal_bias: 0.20
    z_bias: 0.02
    over_objects: true
    snap_to_heightmap: true
    snap_follow_heightmap: true
    z_lift_m: 0.03
    snap_max_raise_m: 2.0
    road_bed_conform: true
    start_end_fade: [0.0, 0.0]
    stitch_abutting: true
    stitch_tol_m: 1.25
    width_fill_dip_m: 40.0
    width_blend_m: 25.0
    highways: [secondary, primary, tertiary, trunk, motorway]
