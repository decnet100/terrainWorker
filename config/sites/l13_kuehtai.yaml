# Zweites Testgebiet: L13 Sellraintal / Kühtai (Galerien, Brücken).
# Aktivieren:  $env:AUTOROAD_SITE="config/sites/l13_kuehtai.yaml"
# oder Datei nach config/site.yaml kopieren.
name: tirol-l13-kuehtai-2048
crs: EPSG:31254
authorities: tirol
# 2048×2048 m — covers Rauheneck + Mugkögele/Marcheck (needs >1109 m east–west).
# (1536 is not a BeamNG-friendly power-of-two heightmap size.)
# Center ~54646/231782
bbox:
  - 53878.0
  - 230758.0
  - 55926.0
  - 232806.0

sources:
  dgm:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Gelaendemodell_50cm_M28"
    version: "1.0.0"
    resolution_m: 0.5
  ortho:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/orthofoto/MapServer/WCSServer"
    coverage: "Aktuell_RGB"
    resolution_m: 1.0
  roads:
    type: osm
  gip:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Verkehrswege/WFSServer"
    type_name: "Verkehrswege:Verkehrswege"
    str_code: L13
  landuse:
    type: featureserver   # Tirol Landnutzung + Waldfläche (see tools/fetch_landcover.py)
    # type: osm           # Overpass fallback
    layers:
      landnutzung:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Landnutzung/FeatureServer/0"
        label: Landnutzung
      waldflaeche:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Waldflaeche/FeatureServer/0"
        label: Waldfläche
    note: "Almen/Wald/Gewässer → terrain masks; Hochwald vs Strauch → mask_forest_*"

beamng:
  meters_per_pixel: 1.0
  level_name: autoroad_galerie_2048
  mask_size: 2048
  slope_rock_deg: 43
  slope_rock_open_px: 1       # entfernt dünne Konturstreifen; 0 = roh (Zebra)
  road_width_scale: 1.0
  lane_width_m: 3.75
  default_lanes: 2
  shoulder_m: 0.1
  bridges:
    # Defaults for all bridges; override per structure in items[]
    defaults:
      width_m: 7.5
      width_from_road: true
      depth_m: 0.4
      deck_lift_m: 0.0
      # TEMP test: MeshRoad node Z = top surface (no -depth/2). Revert if too high.
      node_z_is_top: true
      extend_before_m: 0.5   # meters past gap/GIP along OSM road (MeshRoad only)
      extend_after_m: 0.5
      # Rock under-mask starts at gap ends, then shrinks inward by this (extends stay asphalt)
      under_inset_m: 5.0
      auto_span: true         # grow along road until full-width ditch clears
      span_dip_m: 0.55
      span_search_m: 25.0
      step_m: 1.0
      crossfall_max: 0.12   # clamp heightmap Querneigung (~7 deg)
      style:
        understructure: none  # none | slab | piers | walls  (later)
        edge: none            # none | guardrail | curb | wall (later)
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        # MeshRoad: textureLength = m along road per UV repeat (V only).
        # Across width UV is always 0..1 — use detail_scale for finer grain.
        # Keep in sync with decal_roads.texture_length for a uniform asphalt look.
        texture_length: 6.0
        detail_scale: 4.0
    items:
      # Klammbach: oblique ditch — longer after-side on road centerline
      - match: { objectid: 7233, name: Klammbach }
        extend_before_m: 2.0
        extend_after_m: 3.5
        under_inset_m: 5.0
        style:
          understructure: slab
          edge: none
  galleries:
    # Same pattern as bridges: defaults + items[] (match objectid / name).
    # MVP: open U-shell DAE + terrain hole map (build_galleries.py)
    # Abutting GIP fragments (same name) → one gallery (no interior portal)
    merge_abutting: true
    merge_tol_m: 15.0
    # Optional hard groups if auto-merge misses: merge_groups: [[7236, 10099]]
    defaults:
      width_m: 7.5
      width_from_road: true
      clear_height_m: 3.0      # Fahrraum; Hole nur wo Terrain darüber liegt
      roof_thickness_m: 0.5
      wall_thickness_m: 0.4
      overhang_m: 1.0          # Dachüberstand ≥ deck_open_extra (deckt Brüstung)
      extend_before_m: 2.0     # Übergang vor/nach GIP-Segment
      extend_after_m: 2.0
      step_m: 2.0
      crossfall_max: 0.12
      open_side: left          # left | right | both | none — Blickrichtung
      # Holemap: manuell (Build erhält theTerrain_holemap_manual.png falls vorhanden).
      z_profile: hermite
      portal_grade_step_m: 1.0
      portal_grade_jump: 0.04
      portal_grade_baseline_n: 3
      portal_out_extra_m: 2.0
      portal_grade_span_m: 3.0
      portal_jump_min_grade: 0.12
      portal_search_out_m: 25.0
      portal_search_in_m: 15.0
      hole_mode: none
      hole_pad_m: 0.0
      hole_portal_length_m: 4.0
      hole_out_bite_m: 2.0
      hole_above_road_m: 0.15
      hole_max_above_m: 50.0
      hole_width_scale: 1.0
      # Fahrbahn (MeshRoad) + Block-Portalrahmen (Pfeiler/Sturz)
      deck_enabled: true
      deck_depth_m: 0.5
      # Extra zur Straßenbreite: unter die Innenwand schieben (kein Spalt)
      deck_width_extra_m: 0.5
      deck_open_extra_m: 0.8   # Fahrbahn nur zur offenen Seite verlängern
      parapet_height_m: 1.0
      parapet_thickness_m: 0.35
      parapet_out_m: 0.25       # Brüstung nach außen (Innenkante bleibt)
      column_spacing_m: 4.0
      column_along_m: 0.4
      column_lat_m: 0.35
      # 0 = mittig auf Brüstung; >0 Richtung Außenkante (wird aufs Band geklemmt)
      column_out_m: 0.0
      deck_extend_m: 12.0         # MeshRoad folgt Terrain über die Portale hinaus
      approach_mode: marry        # Auffahrt = DGM (an Terrain anbinden); Galerie = Hermite
      portal_ease_m: 4.0          # kurzer C1-Übergang knapp innerhalb der Portale
      approach_lift_m: 0.015      # MeshRoad knapp über Terrain (kein Z-Fight)
      approach_blend_m: 12.0      # nur für approach_mode: hermite_blend
      portal_frame: block
      portal_block_m: 0.7
      portal_depth_m: 1.0
      portal_overhang_m: 0.8
      portal_clear_extra_m: 0.25  # Pfeiler außen an der Fahrbahn, nicht durchschneiden
      # Fels-Kragen: vorige Dach-Form (Portal → DGM)
      portal_collar: false
      portal_collar_out_m: 5.0
      portal_collar_side_m: 7.0
      portal_collar_sink_m: 0.1
      portal_collar_rings: 4
      debug_centerline: false    # MeshRoad hat immer Collision — nur bei Bedarf + hoch gehoben
      blend_open_dgm: true
      terrain_embed_lower_z_m: 2.0
      style:
        shell: gallery
        columns: rect          # none | rect — Brüstung + Säulen offene Seite
        edge: none
        portal: block
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        collar: GalleryRock
        # Same asphalt UV scale as decal_roads / bridges
        texture_length: 6.0
        detail_scale: 4.0
    items:
      # Mugkögele = GIP 7236+10099 (merged to one span; primary oid = longest)
      - match: { objectid: [7236, 10099], name: Mugkögele }
        open_side: left
        clear_height_m: 3.0
        hole_mode: none
        deck_enabled: true
        deck_width_extra_m: 0.5
        deck_open_extra_m: 0.8
        overhang_m: 1.0
        parapet_height_m: 1.0
        approach_mode: marry
        style:
          columns: rect
      - match: { objectid: 8276, name: Rauheneck }
        open_side: left
        clear_height_m: 3.0
        extend_before_m: 3.0
        extend_after_m: 3.0
        hole_mode: none
        deck_enabled: true
        deck_width_extra_m: 0.5
        deck_open_extra_m: 0.8
        overhang_m: 1.0
        parapet_height_m: 1.0
        parapet_thickness_m: 0.35
        column_spacing_m: 4.0
        deck_extend_m: 12.0
        approach_mode: marry
        portal_ease_m: 4.0
        approach_lift_m: 0.015
        portal_frame: block
        portal_block_m: 0.7
        portal_depth_m: 1.0
        portal_overhang_m: 0.8
        portal_clear_extra_m: 0.25
        style:
          columns: rect
  guardrails:
    enabled: true
    style: sections
    shape: "/art/shapes/objects/italy_guardrails_common_section.dae"
    mesh_length_m: 3.1
    section_length_m: 4.2
    curve_r15_m: 15.0
    curve_r10_m: 10.0
    curve_step_r15_m: 2.8
    curve_step_r10_m: 2.2
    abut_overlap_m: 0.08
    curvature_window_m: 8.0
    lateral_extra_m: 0.15
    z_sample_inward_m: 0.35
    sides: both
    highways: [secondary, primary, tertiary, trunk, motorway]
    z_lift_m: 0.05
    pivot_ground_offset_m: 0.0
    align_pitch: true
    snap_to_heightmap: true
    face_y_outward: true
    yaw_flip_right: false
    # Vor Galerie/Tunnel enden (kein Durchlauf durch die Rauheneck)
    clip_galleries: true
    stop_before_gallery_m: 3.0
    gallery_clip_pad_m: 2.0

  # Tirol Gewässer → Terrain Mud immer; Mesh nur für stehende Kleinteiche.
  # Fließend als River aus Landcover-Polygonen = zu breite Scheiben → flowing: none
  water:
    enabled: true
    flowing: none              # none | river (river erst mit echter Mittellinie)
    standing: waterblock       # none | waterblock
    standing_max_side_m: 40.0
    depth_m: 3.0
    surface_lift_m: 0.15
    min_area_m2: 40.0
    grid_element_size: 4.0

  # Tirol Wald → Forest scatter (douglasfir from driver_training)
  forest:
    enabled: true
    spacing_high_m: 10.0     # Hochwald
    spacing_scrub_m: 5.0     # Strauch / Krummholz
    slope_max_deg: 42.0
    clear_road_m: 4.0
    max_items: 12000
    seed: 13

  # OSM centerlines → BeamNG DecalRoad (asphalt + optional centerline paint)
  decal_roads:
    enabled: true
    width_scale: 0.9
    material: Asphalt
    texture_length: 6.0          # match MeshRoad asphalt tiling
    detail_scale: 4.0            # written into shared Asphalt Material
    render_priority: 10
    drivability: 1.0
    improved_spline: true
    over_objects: false          # true = auch über MeshRoad/Brücke projizieren
    clip_galleries: true         # Decal endet vor Galerie (Deck hat schon Asphalt)
    stop_before_gallery_m: 2.0
    gallery_clip_pad_m: 1.0
    highways: [secondary, primary, tertiary, trunk, motorway, unclassified]
    centerline:
      enabled: true
      style: dashed              # solid | dashed | none
      width_m: 0.15
      material: Road_Line_White
      dash_m: 3.0
      gap_m: 6.0
      render_priority: 25

annotations:
  gpkg: data/annotations/tirol-l13-kuehtai-2048.gpkg
  guardrail_source: auto

notes: |
  L13 Sellraintal / Kühtai 2048×2048 m (Rauheneck + Mugkögele/Marcheck).
  GIP: python tools/fetch_gip.py
  WGS84 approx: expand west of prior 1024 tile to include Mugkögele.
