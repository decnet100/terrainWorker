# Mega-Fernpass (B179) — 8192×8192 m @ 1 m/px (max. BeamNG-Heightmap).
# Aktivieren:  $env:AUTOROAD_SITE="config/sites/fernpass_mega.yaml"
# Center ~38400 / 246100 (EPSG:31254) — gleich wie fernpass.yaml
name: tirol-fernpass-8192
crs: EPSG:31254
bbox:
  - 34304.0
  - 242004.0
  - 42496.0
  - 250196.0
# Absolute GHA (m) at DGM-bbox center — Roadtrip Tyrol sky-arc target.
center_z_m: 1065.3

sources:
  dgm:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Gelaendemodell_50cm_M28"
    version: "1.0.0"
    resolution_m: 1.0
    tile_px: 1024
    tile_retries: 4
  # DOM = DSM (Oberflächenmodell) — für nDSM / Vegetationshöhe (DOM − DGM)
  dom:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Oberflaechenmodell_50cm_M28"
    version: "1.0.0"
    resolution_m: 1.0
    tile_px: 1024
    tile_retries: 4
  # TWI from DGM (build_twi.py); smooth_m = Gaussian σ in metres
  twi:
    smooth_m: 10.0
  # Schnee-Proxy aus DGM (Höhe/Exposition/Neigung/T0) — build_snow_proxy.py
  # Presets: november | june | september | winter  (Parameter hier überschreibbar)
  # BEV INSPIRE Land Cover (WMS→GeoTIFF), 6 Klassen @ mask_size
  # https://data.bev.gv.at/geoserver/INSdataLC/wms — Layer LC.LandCoverRaster
  # Incomplete mosaics -> class 6 nodata (rectangular holes).
  # Fetch splits into tiles and re-requests only bad ones (raster_tile_fetch).
  bev_landcover:
    type: wms
    url: "https://data.bev.gv.at/geoserver/INSdataLC/ows"
    layer: LC.LandCoverRaster
    # size: 8192   # default = beamng.mask_size
    tile_px: 1024
    tile_retries: 4
    tile_retry_sleep_s: 3
    max_nodata_frac: 0.02
    max_tile_nodata_frac: 0.05
    retries: 3
    retry_sleep_s: 5
  snow:
    type: dgm_proxy
    preset: november
    # t0_c: 4.0              # °C bei z0_m
    # z0_m: 1200
    # lapse_c_per_m: 0.0065
    # snow_temp_c: 0.0       # darüber kein Schnee
    # full_snow_temp_c: -5.0 # darunter volle Decke
    # aspect_strength: 0.35  # Nord+/Süd−
    # steep_deg: 48
    # steep_factor: 0.25
  ortho:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/orthofoto/MapServer/WCSServer"
    coverage: "Aktuell_RGB"
    resolution_m: 1.0
  # Far backdrop texture (CH + surroundings). Title: SWISSIMAGE Hintergrund.
  backdrop_ortho:
    type: wms
    url: "https://wms.geo.admin.ch/"
    layer: ch.swisstopo.swissimage
    version: "1.3.0"
  roads:
    type: osm
  gip:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Verkehrswege/WFSServer"
    type_name: "Verkehrswege:Verkehrswege"
    str_code: B179                 # Durchgangsroute (Trunk-Spine)
    include: bbox                  # ganzer Verkehrswege-Layer in site.bbox (nicht nur L+B)
  strassennetz:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Strassennetz/WFSServer"
    type_name: "Strassennetz:Strassennetz"
    str_code: B179
  landuse:
    # BEV INSPIRE Land Cover (WMS) → terrain classes + biome masks
    type: bev
    # Tirol FeatureServer kept as optional fallback (set type: featureserver)
    layers:
      landnutzung:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Landnutzung/FeatureServer/0"
        label: Landnutzung
      waldflaeche:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Waldflaeche/FeatureServer/0"
        label: Waldfläche
  tiris_buildings:
    type: featureserver
    url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Gebaeude/FeatureServer/0"

beamng:
  meters_per_pixel: 1.0
  level_name: autoroad_fernpass_8192
  mask_size: 8192
  slope_rock_deg: 40
  slope_rock_open_px: 1
  road_width_scale: 0.9
  # Carriageway = lanes × lane_width_m (default 2 × 3.75 = 7.5 m).
  lane_width_m: 3.75
  default_lanes: 2
  # Option 2: no terrain Asphalt — gravel bed/bankett; DecalRoad = Fahrbahn.
  road_terrain: asphalt
  dirt_material: gravel
  dry_grass_material: dry_meadow   # user material (ex Grass20_copy) for meadow_dry
  forest_material: ForestFloor     # user material for forest_tall/scrub
  grass_material: Grass            # green grass (meadow_wet / forest_gap)
  snow_material: snow              # snow_light / snow_heavy paint
  shoulder_m: 3.0

  # GIP-Korridore für Brücken/Galerien. Trunk = sources.gip.str_code (isoliert).
  roads:
    spine_start_oid: null          # optional, sonst längstes Trunk-Stück
    spine_next: []                 # - {from_oid, to_oid, note} an Gabelungen
    # Surface vs tunnel, extra side-cut OIDs, L* fallback:
    # data/roads/gip_overrides.yaml  (not_tunnel 3690/3691/3843).

  # BEV × nDSM × TWI × snow_proxy → biomes + soft terrain (compose_biomes.py)
  compose:
    ndsm_canopy_m: 5.0
    ndsm_scrub_m: 1.5
    ndsm_clearing_m: 1.0
    twi_wet: 5.0
    snow_light: 0.25
    snow_heavy: 0.55

  bridges:
    defaults:
      profile: road_spline          # road_span_profile → 4 MeshRoad strips
      centerline: gip               # gip | strassennetz | osm
      width_m: 7.5                  # = default_lanes × lane_width_m
      width_from_road: false
      depth_m: 0.4
      node_z_is_top: true
      extend_before_m: 0.0
      extend_after_m: 0.0
      under_inset_m: 5.0
      gip_pad_m: 10.0
      auto_span: true
      span_dip_m: 0.45
      span_search_m: 40.0
      solid_run_m: 3.0
      free_span: linear             # no Hermite sag
      corner_up_m: 0.25
      corner_down_m: 0.06
      corner_band: 0.2
      abut_tol_m: 0.25
      abut_run_m: 3.0
      abut_search_m: 40.0
      abut_snap_z: true
      approach_conform: true
      approach_conform_pad_m: 0.5
      approach_conform_falloff_m: 1.5
      approach_conform_sink_m: 0.02
      approach_conform_max_delta_m: 1.0
      # Unter der Platte Heightmap auf MeshRoad-Z (Decal liegt drauf); Falloff bleibt 1 m.
      approach_conform_deck_raise_m: 16.0
      step_m: 1.0
      crossfall_max: 0.12
      style:
        understructure: none
        edge: none
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        texture_length: 6.0
        detail_scale: 4.0
    # Kunstbauten ohne KUNSTBAUTEN-Feld nachtragen (FeatureServer OBJECTID).
    # Default-Name: "Brücke {oid}" / "Tunnel {oid}" (oder name: …).
    gip_extra:
      - objectid: 3992
        name: Brücke 3992
      - objectid: 2304
        name: Brücke 2304
      - objectid: 3836
        name: Brücke 3836
      - objectid: 3844
        name: Brücke 3844
      - objectid: 3852
        name: Brücke 3852
      # Unterflur / Rampe: langer S-BR → Tunnel auf der 8081-Seite (nicht die Außenhälfte).
      - objectid: 8082
        kind: tunnel
        name: Tunnel 8082
    items:
      - match: { objectid: 101710 }
        enabled: false              # falsch gesnappt — raus
      - match: { objectid: 3168, name: Fernsteinbrücke }
      - match: { objectid: 4103, name: Kriegerbachbrücke }
      - match: { objectid: 3992, name: Brücke 3992 }
      - match: { objectid: 2304, name: Brücke 2304 }
        extend_before_m: 1.0
        extend_after_m: 1.0
        road_bed_sink_m: 0.0
      - match: { objectid: 3836, name: Brücke 3836 }
      - match: { objectid: 3844, name: Brücke 3844 }
        extend_before_m: 1.0
        extend_after_m: 1.0
        abut_snap_z: false          # kein Hochziehen auf den Tunnelhügel
        auto_span: false            # nur GIP-Länge, nicht 40 m Dip-Suche
        gip_pad_m: 2.0
        abut_search_m: 8.0
        # Seite höher/tiefer (m) an Span-s0 / s1 (= Reihenfolge portal_z in bridges_meta);
        # Grade dazwischen passt sich an. Beispiel: portal_z_offset_m: [0.0, -1.2]
        portal_z_offset_m: [0.0, 0.0]
        crossfall_max: 0.0             # kein Roll aus HM-Querprofil (Tunnelböschung)
        approach_conform: true
        approach_conform_pad_m: 4.0          # breiter hart ums Deck
        approach_conform_falloff_m: 8.0      # weicher Auslauf in die Hügel
        approach_conform_max_delta_m: 10.0   # sonst: |Hügel−Deck| > 3 m → unberührt
        approach_conform_sink_m: 0.02        # Sinking in Tiefe (0.01 = 1 cm, default 0.02 cm)    
      - match: { objectid: 3852, name: Brücke 3852 }
        abutment_s: [13408.0, 13425.0] #s, north
        width_m: 8.0
        # Deck muss über die Schwellen-Zone vor der Kerbe reichen
        extend_before_m: 25.0
        extend_after_m: 12.0
        free_span: linear
        approach_conform: true
        approach_conform_max_cut_m: 12.0
        approach_conform_max_raise_m: 0.8

  galleries:
    merge_abutting: true
    merge_tol_m: 15.0
    merge_groups:
      - [3699, 3842]   # Lermooser: Ende-an-Ende (beide GIP-Enden am Stoß)
    defaults:
      centerline: gip               # gip | strassennetz | osm
      width_m: 7.5
      width_from_road: true
      clear_height_m: 4.5
      roof_thickness_m: 0.5
      wall_thickness_m: 0.4
      overhang_m: 1.0
      extend_before_m: 2.0
      extend_after_m: 2.0
      step_m: 2.0
      open_side: left
      deck_enabled: true
      deck_width_extra_m: 0.5
      deck_open_extra_m: 0.8
      deck_extend_m: 12.0
      z_profile: linear
      free_span: linear
      approach_mode: marry
      approach_lift_m: 0.015
      portal_ease_m: 0.0
      portal_frame: block
      portal_block_m: 0.7
      portal_depth_m: 1.0
      portal_overhang_m: 0.8
      portal_clear_extra_m: 0.25
      portal_collar: false
      hole_mode: none
      blend_open_dgm: true
      style:
        shell: gallery
        columns: rect
        edge: none
        portal: block
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        collar: GalleryRock
        texture_length: 6.0
        detail_scale: 4.0
    items:
      # 8082: GIP ~211m; nur der 8081-nahe Abschnitt ist Tunnel.
      # trim_s0 = GIP-Start (BeamNG ~6513,5564), trim_s1 = GIP-Ende an 8081 (~6349,5677).
      # Seite zu lang → jeweiligen trim erhöhen; zu kurz → verringern.
      - match: { objectid: 8082 }
        open_side: none
        style: { shell: tunnel }
        trim_s0_m: 156.0
        trim_s1_m: 30.0
        extend_before_m: 1.0
        extend_after_m: 1.0
        deck_extend_m: 4.0
        # Unterführung: Dach nicht als Fels über Fernpass-Asphalt; Asphalt + Decal bleiben.
        terrain_roof: keep_asphalt
      # Lermooser: 3699 (~2,5 km) + 3842 (~730 m) Ende-an-Ende (merge_abutting).
      # Wie Landecker: GIP-Achse, ein Tageslichtportal, Z linear entlang der Achse.
      # Südportal auf der Karte am OSM-Portalbau; Nordende von 3699 liegt außerhalb.
      # Brücke 3844 sitzt ~80 m vor der Tür — Ankopplung später, kein append.
      - match: { name: Lermooser Tunnel }
        one_ended: true
        fake_end_drop_m: 10
        z_profile: linear
        portal_ease_m: 0.0
        daylight_near_objectid: 3844   # welches Ende (Brücke), nicht Kartenrand
        # 3690 = S-BT am OSM-Portalbau; Tür 10 m längs GIP nach außen / tiefer.
        portal_shift_from_objectid: 3690
        portal_shift_out_m: 10.0
        deck_extend_m: 0
        deck_width_extra_m: 0.0
        deck_open_extra_m: 0.0
        style: { shell: tunnel }
      # Kurze S-BT-Stummel Tür → Brücke: nicht als eigene Röhren.
      - match: { objectid: [3690, 3691, 3843] }
        enabled: false

  guardrails:
    enabled: true
    style: sections               # posts | sections | both
    spacing_m: 25.0               # 25 or 50 m typical AT (posts)
    post_shape: reflector
    post_scale: 0.7
    section_shape: "/art/shapes/objects/italy_guardrails_common_section.dae"
    # Section-rail knobs (when style includes sections):
    mesh_length_m: 3.1
    section_length_m: 4.2
    curve_r15_m: 15.0
    curve_r10_m: 10.0
    curve_step_r15_m: 2.8
    curve_step_r10_m: 2.2
    abut_overlap_m: 0.08
    curvature_window_m: 8.0
    lateral_extra_m: 0.25
    z_sample_inward_m: 0.35
    # Brücken: Z = MeshRoad-Deck (nicht DGM-Schlucht); enger an den Fahrbahnrand
    bridge_deck_z: true
    bridge_lateral_extra_m: 0.0     # roadside 0.25 → auf Deck an die Kante
    bridge_match_pad_m: 1.5
    # steep = DGM-Probe; Achse = GIP Verkehrswege (OBJECTID-Segmente)
    sides: steep
    centerline: gip                # gip | strassennetz | osm
    # Keine Planken/Poller auf Gassen/Forst/Rad, Parkplätzen (S-BP), Rampen (S-BR).
    steep_sides:
      sample_m: 80
      look_out_m: 6.0
      drop_m: 2.5
      min_hits: 1
      fallback: both
    highways: [secondary, primary, tertiary, trunk, motorway]
    z_lift_m: 0.05
    pivot_ground_offset_m: 0.0
    align_pitch: true
    snap_to_heightmap: true
    face_y_outward: true
    yaw_flip_right: false
    clip_galleries: true
    stop_before_gallery_m: 3.0
    gallery_clip_pad_m: 2.0
    # Mündungen: nur Seite zur fremden Achse; Tunnel/Brücken-Δz nicht öffnen
    clip_centerlines: false
    open_junctions: true
    junction_join_m: 4.0
    junction_mouth_m: 12.0
    junction_z_sep_m: 3.0
    # Tunnel: keine Rails in der Draufsicht über der Röhre (Berg)
    clip_tunnels: true
    tunnel_clip_pad_m: 25.0
    # Cascade: spätere Treffer überschreiben frühere. Match auf osm_id / lanes / highway.
    rules:
      # Tunnel / Unterflur: keine Planken (auch nicht über der Röhre auf dem Berg)
      - match: { objekt: S-BT }
        sides: none
      - match: { kunstbauten: [Tunnel, Unterflur] }
        sides: none
      # Explizit (Fernpass): Lermooser + Nassereith
      - match: { ids: [3699, 3842, 4299, 3690, 3691, 3843] }
        sides: none
      # Mehrspurig: Leitpoller / Planken beidseitig (überschreibt steep)
      - match: { lanes: ">2" }
        sides: both

  water:
    enabled: true
    flowing: none
    standing: waterblock
    # One AABB WaterBlock per lake (not a dense tile grid — FPS).
    # Tiling only if a single side exceeds standing_max_side_m.
    shore_inset_m: 1.0
    standing_max_side_m: 2500.0
    standing_tile_m: 128.0
    # Cover irregular corners the AABB would miss (~5–8%).
    standing_xy_pad: 0.08
    # Basin under LN-GWS only (WFS standing water), soft shore blend.
    standing_depress_m: 5.0
    standing_depress_blend_m: 6.0
    # Off: wide floodplains as WaterBlocks explode object count / FPS.
    wide_flowing_min_width_m: 0.0
    depth_m: 10.5
    surface_lift_m: 0.15
    # Global WaterBlock Z nudge (m); negative = lower. Tune after visual check.
    waterlevel_z_offset_m: -4.0
    # Post-pass (defaults on in build_water): hang over steps / MeshRoad under lake.
    # fit_check: true
    # hang_max_m: 2.5
    # meshroad_clearance_m: 0.75
    min_area_m2: 40.0
    grid_element_size: 4.0

  forest:
    enabled: true
    trees: true
    dry_grass: false
    # Cheap bush imposters (no collision). 250k trees is the playable density.
    cheap: true
    spacing_high_m: 2.5
    spacing_scrub_m: 2.0
    spacing_meadow_m: 5.0
    slope_max_deg: 42.0
    slope_max_meadow_deg: 38.0
    clear_road_m: 4.0
    max_items: 250000
    max_items_meadow: 100000
    scrub_fraction: 0.0
    # large fir (~19 m mesh): 0.9–1.3 → ~17–25 m
    scale_high: [0.9, 1.3]
    scale_scrub: [0.85, 1.2]
    seed: 13

  # Far = Copernicus GLO-30 + viewshed. Mid = 1–10 km Copernicus 50 m. Near = Tirol DGM.
  backdrop:
    radius_m: 40000
    observer_grid: 5
    observer_z_extra_m: 10
    extra_peaks: 4
    min_views: 1
    viewshed_step_m: 50
    mesh_step_m: 120
    hole_pad_m: 30
    near_m: 2000
    near_step_m: 5
    near_dgm_res_m: 2
    near_overlap_m: 80
    near_lip_drop_m: 1.0     # inner ring sits below the playable lip (cliff, no tuck)
    near_texture_size: 2048
    near_tiles: 9             # 2 km ring @ 5 m — letter tiles, stay under 65k verts
    near_canopy: true
    near_canopy_min_m: 1.0
    near_canopy_spike_m: 8.0
    near_canopy_min_area_m2: 40
    mid_m: 10000             # near→10 km band, Copernicus @ 50 m, own texture
    mid_step_m: 15
    mid_overlap_m: 150
    mid_texture_size: 2048
    mid_tiles: 8             # 10 km ring @ 15 m, letter names (no _00 LOD trap)
    n_rays: 2048
    curvature_cc: 0.85714
    texture_size: 2048
    albedo_gain: 0.58        # ortho is already sunlit; <1 avoids a washed-out look
    # snow overlay uses sources.snow + compose.snow_light/snow_heavy

  buildings:
    enabled: true
    # TIRIS + 0.9 m Traufe is the code default. OSM skip only if source: osm.
    skip_osm_ids: [123491016]
    default_height_m: 8.0
    level_height_m: 3.0
    min_area_m2: 25.0
    max_area_m2: 8000.0
    max_items: 5000
    sink_m: 1.5
    height_jitter: 0.12
    gable_chance: 0.72
    gable_fill_min: 0.88
    style_seed: 17

  decal_roads:
    enabled: true
    centerline_source: gip            # gip | strassennetz | osm
    # named = DecalRoads only on STR_CODE (B179/L…); Gassen get terrain asphalt + road-bed.
    gip_decals: named
    width_scale: 0.9
    # Distinct from TerrainMaterial "Asphalt" (name clash → white/broken Decals).
    material: Road_Asphalt
    texture_length: 6.0
    detail_scale: 4.0
    render_priority: 10
    drivability: 1.0
    improved_spline: true
    densify_max_step_m: 10.0
    decal_bias: 0.20
    z_bias: 0.02
    snap_to_heightmap: true
    z_lift_m: 0.03
    snap_max_raise_m: 2.0
    # Smooth DGM under roads so Decals capture clean tris (needs terrain re-import).
    # Shared value/opacity raster over all roads, then one composite onto heightmap.
    road_bed_conform: true
    road_bed_pad_m: 1.0
    road_bed_falloff_m: 3.0
    road_bed_sink_m: 0.08
    road_bed_max_delta_m: 2.0
    # Dips = raise; high bank sawteeth = cut into hillside (needs larger cut).
    road_bed_max_raise_m: 2.0
    road_bed_max_cut_m: 2.0
    road_bed_smooth_m: 12.0
    road_bed_items:
      - match: { objectid: [3998, 4163] }
        pad_m: 3.0
        falloff_m: 4.0
        sink_m: 0.12
        max_raise_m: 2.5
        max_cut_m: 12.0
        smooth_m: 16.0
    over_objects: false
    # 0 = no fade at ends (default 2+2m caused visible gaps at every OSM-way joint).
    start_end_fade: [0.0, 0.0]
    # OSM inserts 3–6 m connector ways (e.g. GIP 2169 / Fernpass Rast); stitch them
    # before min_length_m drops the stubs and leaves asphalt gaps.
    stitch_abutting: true
    stitch_tol_m: 1.25
    # Fill short narrow OSM stubs (2–1–3 pinches); soft-ramp remaining lane steps.
    width_fill_dip_m: 40.0
    width_blend_m: 25.0
    # Long single DecalRoads (e.g. OSM 731 ~700m) often lose asphalt geometry in BeamNG.
    max_decal_length_m: 300.0
    clip_galleries: true
    stop_before_gallery_m: 2.0
    gallery_clip_pad_m: 1.0
    # Terrain-Decal an MeshRoad-Widerlagern abschneiden, dann Decal auf der Platte.
    clip_bridges: true
    deck_decals: true
    deck_decal_overlap_m: 1.0
    # OSM-Road-bed nicht in den Graben; stattdessen Heightmap auf MeshRoad-Z.
    road_bed_skip_bridge_unders: true
    road_bed_conform_bridge_decks: true
    road_bed_bridge_deck_raise_m: 16.0
    road_bed_bridge_pad_m: 2.0
    highways: [secondary, primary, tertiary, trunk, motorway, unclassified]
    centerline:
      enabled: true
      style: dashed
      width_m: 0.15
      material: Road_Line_White
      dash_m: 3.0
      gap_m: 6.0
      render_priority: 25
      decal_bias: 0.22
annotations:
  gpkg: data/annotations/tirol-fernpass-8192.gpkg
  guardrail_source: heuristic

notes: |
  Mega-Fernpass B179, 8192×8192 m @ 1 m/px, center EPSG:31254 ~38400/246100.
  Pipeline: python tools/build_level.py --site config/sites/fernpass_mega.yaml
  (fetch_dgm/dom/bev → twi/snow → smoke/masks → setup → ensure_terrain_materials →
  compose_biomes → build_forest). Materials: dry_meadow (dirt base), ForestFloor
  (50/50 mudgrass PNG). Then bridges/galleries, then water (fit_check needs MeshRoads),
  decal/guardrails as needed.
