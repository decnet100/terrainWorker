# Mega-Fernpass (B179) — 8192×8192 m @ 1 m/px (max. BeamNG-Heightmap).
# Aktivieren:  $env:AUTOROAD_SITE="config/sites/fernpass_mega.yaml"
# Center ~38400 / 246100 (EPSG:31254) — gleich wie fernpass.yaml
name: tirol-fernpass-8192
crs: EPSG:31254
bbox:
  - 34304.0
  - 242004.0
  - 42496.0
  - 250196.0

sources:
  dgm:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Gelaendemodell_50cm_M28"
    version: "1.0.0"
    resolution_m: 1.0
  ortho:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/orthofoto/MapServer/WCSServer"
    coverage: "Aktuell_RGB"
    resolution_m: 1.0
  roads:
    type: osm
  gip:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Verkehrswege/WFSServer"
    type_name: "Verkehrswege:Verkehrswege"
    str_code: B179
  landuse:
    type: featureserver
    layers:
      landnutzung:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Landnutzung/FeatureServer/0"
        label: Landnutzung
      waldflaeche:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Waldflaeche/FeatureServer/0"
        label: Waldfläche

beamng:
  meters_per_pixel: 1.0
  level_name: autoroad_fernpass_8192
  mask_size: 8192
  slope_rock_deg: 43
  slope_rock_open_px: 1
  road_width_scale: 0.9
  # Option 2: no terrain Asphalt — gravel bed/bankett; DecalRoad = Fahrbahn.
  road_terrain: gravel
  dirt_material: gravel
  shoulder_m: 3.0

  bridges:
    defaults:
      width_m: 7.0
      width_from_road: true
      depth_m: 0.4
      node_z_is_top: true
      extend_before_m: 0.0
      extend_after_m: 0.0
      under_inset_m: 5.0
      gip_pad_m: 10.0
      auto_span: true
      span_dip_m: 0.45
      span_search_m: 40.0
      abut_tol_m: 0.25
      abut_run_m: 3.0
      abut_search_m: 40.0
      abut_snap_z: true
      approach_conform: true
      approach_conform_pad_m: 0.5
      approach_conform_falloff_m: 1.5
      approach_conform_sink_m: 0.02
      approach_conform_max_delta_m: 1.0
      step_m: 1.0
      crossfall_max: 0.12
      style:
        understructure: none
        edge: none
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        texture_length: 6.0
        detail_scale: 4.0
    # Kunstbauten ohne KUNSTBAUTEN-Feld nachtragen (FeatureServer OBJECTID).
    # Werden als "Brücke 1", "Brücke 2", … benannt (oder name: …).
    gip_extra:
      - objectid: 101710
    items:
      - match: { objectid: 3168, name: Fernsteinbrücke }
      - match: { objectid: 4103, name: Kriegerbachbrücke }
  galleries:
    merge_abutting: true
    merge_tol_m: 15.0
    defaults:
      width_m: 7.0
      width_from_road: true
      clear_height_m: 4.5
      roof_thickness_m: 0.5
      wall_thickness_m: 0.4
      overhang_m: 1.0
      extend_before_m: 2.0
      extend_after_m: 2.0
      step_m: 2.0
      open_side: left
      deck_enabled: true
      deck_width_extra_m: 0.5
      deck_open_extra_m: 0.8
      deck_extend_m: 12.0
      approach_mode: marry
      approach_lift_m: 0.015
      approach_conform: false
      portal_ease_m: 4.0
      portal_frame: block
      portal_block_m: 0.7
      portal_depth_m: 1.0
      portal_overhang_m: 0.8
      portal_clear_extra_m: 0.25
      portal_collar: false
      hole_mode: none
      blend_open_dgm: true
      style:
        shell: gallery
        columns: rect
        edge: none
        portal: block
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        collar: GalleryRock
        texture_length: 6.0
        detail_scale: 4.0
    items: []

  guardrails:
    enabled: true
    shape: "/art/shapes/objects/italy_guardrails_common_section.dae"
    mesh_length_m: 3.1
    section_length_m: 4.2
    curve_r15_m: 15.0
    curve_r10_m: 10.0
    curve_step_r15_m: 2.8
    curve_step_r10_m: 2.2
    abut_overlap_m: 0.08
    curvature_window_m: 8.0
    lateral_extra_m: 0.25
    z_sample_inward_m: 0.35
    sides: both
    highways: [secondary, primary, tertiary, trunk, motorway]
    z_lift_m: 0.05
    pivot_ground_offset_m: 0.0
    align_pitch: true
    snap_to_heightmap: true
    face_y_outward: true
    yaw_flip_right: false
    clip_galleries: true
    stop_before_gallery_m: 3.0
    gallery_clip_pad_m: 2.0

  water:
    enabled: true
    flowing: none
    standing: waterblock
    # One AABB WaterBlock per lake (not a dense tile grid — FPS).
    # Tiling only if a single side exceeds standing_max_side_m.
    shore_inset_m: 1.0
    standing_max_side_m: 2500.0
    standing_tile_m: 128.0
    # Cover irregular corners the AABB would miss (~5–8%).
    standing_xy_pad: 0.08
    # Basin under LN-GWS only (WFS standing water), soft shore blend.
    standing_depress_m: 5.0
    standing_depress_blend_m: 6.0
    # Off: wide floodplains as WaterBlocks explode object count / FPS.
    wide_flowing_min_width_m: 0.0
    depth_m: 10.5
    surface_lift_m: 0.15
    # Global WaterBlock Z nudge (m); negative = lower. Tune after visual check.
    waterlevel_z_offset_m: -4.0
    min_area_m2: 40.0
    grid_element_size: 4.0

  forest:
    enabled: true
    spacing_high_m: 10.0
    spacing_scrub_m: 5.0
    slope_max_deg: 42.0
    clear_road_m: 4.0
    max_items: 50000
    seed: 13

  buildings:
    enabled: true
    default_height_m: 8.0
    level_height_m: 3.0
    min_area_m2: 25.0
    max_area_m2: 8000.0
    max_items: 5000
    sink_m: 1.5
    height_jitter: 0.12
    gable_chance: 0.72
    gable_fill_min: 0.88
    style_seed: 17

  decal_roads:
    enabled: true
    width_scale: 0.9
    material: Asphalt
    texture_length: 6.0
    detail_scale: 4.0
    render_priority: 10
    drivability: 1.0
    improved_spline: true
    over_objects: false
    clip_galleries: true
    stop_before_gallery_m: 2.0
    gallery_clip_pad_m: 1.0
    highways: [secondary, primary, tertiary, trunk, motorway, unclassified]
    centerline:
      enabled: true
      style: dashed
      width_m: 0.15
      material: Road_Line_White
      dash_m: 3.0
      gap_m: 6.0
      render_priority: 25

annotations:
  gpkg: data/annotations/tirol-fernpass-8192.gpkg
  guardrail_source: auto

notes: |
  Mega-Fernpass B179, 8192×8192 m @ 1 m/px, center EPSG:31254 ~38400/246100.
  Pipeline: fetch_dgm → build_smoke → fetch_landcover → build_terrain_masks →
  fetch_gip → setup_beamng_level → bridges/galleries/decal/guardrails as needed.
