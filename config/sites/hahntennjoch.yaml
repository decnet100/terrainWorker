# Hahntennjoch (L266) — 512×512 m @ 1 m/px. Guardrail / terrain smoke + full pipeline.
# Aktivieren:  $env:AUTOROAD_SITE="config/sites/hahntennjoch.yaml"
name: tirol-m28-test-500m
crs: EPSG:31254
authorities: tirol
bbox:
  - 22150.0
  - 237990.0
  - 22650.0
  - 238500.0
# Absolute GHA (m) at DGM-bbox center — Alpine Roadtrip sky-arc target.
center_z_m: 1705.2

sources:
  dgm:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Gelaendemodell_50cm_M28"
    version: "1.0.0"
    resolution_m: 0.5
  dom:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/terrain/MapServer/WCSServer"
    coverage: "Oberflaechenmodell_50cm_M28"
    version: "1.0.0"
    resolution_m: 0.5
  twi:
    smooth_m: 10.0
  bev_landcover:
    type: wms
    url: "https://data.bev.gv.at/geoserver/INSdataLC/ows"
    layer: LC.LandCoverRaster
  snow:
    type: dgm_proxy
    # september: first dusting above ~1800 m (this crop max ~1880 m).
    preset: september
  ortho:
    type: wcs
    url: "https://gis.tirol.gv.at/arcgis/services/Service_Public/orthofoto/MapServer/WCSServer"
    coverage: "Aktuell_RGB"
    resolution_m: 1.0
  backdrop_ortho:
    type: wms
    url: "https://wms.geo.admin.ch/"
    layer: ch.swisstopo.swissimage
    version: "1.3.0"
  roads:
    type: osm
  gip:
    type: wfs
    url: "https://dservices3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/services/Verkehrswege/WFSServer"
    type_name: "Verkehrswege:Verkehrswege"
    str_code: L72                  # Hahntennjochstraße 2. Teil (this crop)
    include: bbox
  landuse:
    type: bev
    layers:
      landnutzung:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Landnutzung/FeatureServer/0"
        label: Landnutzung
      waldflaeche:
        url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Waldflaeche/FeatureServer/0"
        label: Waldfläche
  tiris_buildings:
    type: featureserver
    url: "https://services3.arcgis.com/hG7UfxX49PQ8XkXh/arcgis/rest/services/Gebaeude/FeatureServer/0"

beamng:
  meters_per_pixel: 1.0
  max_height_m: 254.75
  level_name: autoroad_m28_test
  mask_size: 512
  slope_rock_deg: 38
  road_width_scale: 1.0
  lane_width_m: 3.75
  default_lanes: 2
  shoulder_m: 0.2
  dirt_material: gravel
  dry_grass_material: dry_meadow
  forest_material: ForestFloor
  grass_material: Grass
  snow_material: snow

  compose:
    ndsm_canopy_m: 5.0
    ndsm_scrub_m: 1.5
    ndsm_clearing_m: 1.0
    twi_wet: 5.0
    snow_light: 0.30
    snow_heavy: 0.65

  bridges:
    defaults:
      profile: road_spline
      centerline: gip
      width_m: 7.5
      width_from_road: true
      depth_m: 0.4
      node_z_is_top: true
      extend_before_m: 0.5
      extend_after_m: 0.5
      under_inset_m: 5.0
      auto_span: true
      span_dip_m: 0.45
      span_search_m: 40.0
      step_m: 1.0
      style:
        understructure: none
        edge: none
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        texture_length: 6.0
        detail_scale: 4.0
    items: []

  galleries:
    merge_abutting: true
    merge_tol_m: 15.0
    defaults:
      centerline: gip
      width_m: 7.5
      width_from_road: true
      clear_height_m: 4.5
      roof_thickness_m: 0.5
      wall_thickness_m: 0.4
      overhang_m: 1.0
      extend_before_m: 2.0
      extend_after_m: 2.0
      step_m: 2.0
      open_side: left
      deck_enabled: true
      approach_mode: marry
      style:
        shell: gallery
        columns: rect
        edge: none
        portal: block
      materials:
        top: Asphalt
        bottom: Concrete
        side: Concrete
        collar: GalleryRock
        texture_length: 6.0
        detail_scale: 4.0
    items: []

  guardrails:
    enabled: true
    style: sections
    section_shape: "/art/shapes/objects/italy_guardrails_common_section.dae"
    mesh_length_m: 3.1
    section_length_m: 4.2
    curve_r15_m: 15.0
    curve_r10_m: 10.0
    curve_step_r15_m: 2.8
    curve_step_r10_m: 2.2
    abut_overlap_m: 0.08
    curvature_window_m: 8.0
    lateral_extra_m: 0.55
    z_sample_inward_m: 0.35
    sides: both
    highways: [secondary, primary, tertiary, trunk, motorway]
    z_lift_m: 0.05
    pivot_ground_offset_m: 0.0
    align_pitch: true
    snap_to_heightmap: true
    face_y_outward: true
    yaw_flip_right: false
    clip_galleries: true
    stop_before_gallery_m: 3.0
    gallery_clip_pad_m: 2.0

  water:
    enabled: true
    flowing: none
    standing: waterblock
    standing_max_side_m: 40.0
    depth_m: 3.0
    surface_lift_m: 0.15
    min_area_m2: 40.0
    grid_element_size: 4.0

  forest:
    enabled: true
    trees: true
    dry_grass: false
    spacing_high_m: 9.0
    spacing_scrub_m: 4.5
    slope_max_deg: 42.0
    clear_road_m: 4.0
    max_items: 4000
    scrub_fraction: 0.35
    scale_high: [0.85, 1.3]
    scale_scrub: [0.65, 1.1]
    seed: 13

  backdrop:
    radius_m: 40000
    observer_grid: 5
    observer_z_extra_m: 10
    extra_peaks: 4
    min_views: 1
    viewshed_step_m: 50
    mesh_step_m: 120
    hole_pad_m: 30
    near_m: 1000
    near_step_m: 5
    near_dgm_res_m: 2
    near_overlap_m: 80
    near_lip_drop_m: 1.0
    near_texture_size: 2048
    near_tiles: 9              # 1 km ring @ 5 m, stay under 65k verts/tile
    mid_m: 10000
    mid_step_m: 15
    mid_overlap_m: 150
    mid_texture_size: 2048
    mid_tiles: 8               # 10 km ring @ 15 m, stay under 65k verts/tile
    n_rays: 2048
    curvature_cc: 0.85714
    texture_size: 2048
    albedo_gain: 0.58

  buildings:
    enabled: true
    default_height_m: 8.0
    level_height_m: 3.0
    min_area_m2: 25.0
    max_area_m2: 8000.0
    max_items: 500
    sink_m: 1.5
    height_jitter: 0.12
    gable_chance: 0.72
    gable_fill_min: 0.88
    style_seed: 17

  decal_roads:
    enabled: true
    centerline_source: osm
    width_scale: 0.9
    material: Road_Asphalt
    texture_length: 6.0
    detail_scale: 4.0
    render_priority: 10
    drivability: 1.0
    improved_spline: true
    densify_max_step_m: 10.0
    decal_bias: 0.20
    z_bias: 0.02
    snap_to_heightmap: true
    z_lift_m: 0.03
    road_bed_conform: true
    road_bed_pad_m: 1.0
    road_bed_falloff_m: 3.0
    road_bed_sink_m: 0.08
    stitch_abutting: true
    stitch_tol_m: 1.25
    start_end_fade: [0.0, 0.0]
    max_decal_length_m: 300.0
    clip_galleries: true
    clip_bridges: true
    over_objects: false
    highways: [secondary, primary, tertiary, trunk, motorway, unclassified]
    centerline:
      enabled: true
      style: dashed
      width_m: 0.15
      material: Road_Line_White
      dash_m: 3.0
      gap_m: 6.0
      render_priority: 25
      decal_bias: 0.22

annotations:
  gpkg: data/annotations/tirol-m28-test-500m.gpkg
  guardrail_source: auto

notes: |
  Hahntennjoch ~500x510 m (M28 / L266). Full pipeline + backdrop.
  python tools/build_level.py --site config/sites/hahntennjoch.yaml
  Then: fetch_gip, bridges/galleries (if any), decals, guardrails, water,
  buildings, fetch_backdrop / build_backdrop.
  Portals: alpine-roadtrip tools/build_portals.py (reads this YAML).
  WGS84 approx: 47.2804,10.6258 – 47.2850,10.6324
